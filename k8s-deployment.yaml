apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-pure-compute
  namespace: llama-compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-pure-compute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-pure-compute
    spec:
      containers:
        - name: llama-engine
          image: llama-pure-compute:v1
          imagePullPolicy: Never
          command: ["python3", "-m", "llama_pure_compute.model"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: llama-models-pvc