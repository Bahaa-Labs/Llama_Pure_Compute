[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.0.0", "ninja"]
build-backend = "setuptools.build_meta"
[project]
name = "llama_pure_compute"
version = "0.1.0"
description = "High-Performance C++/CUDA & Triton LLM Inference Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "triton>=2.0.0",
    "pytest"
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "benchmark: marks tests as performance benchmarks (not correctness checks)",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script",
]