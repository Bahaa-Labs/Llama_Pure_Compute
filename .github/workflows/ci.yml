name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ruff>=0.6,<1" \
            "black>=24,<26" \
            "mypy>=1.10,<2"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Black
        run: python -m black --check src tests

      - name: MyPy
        run: python -m mypy src

  cpu-tests:
    name: CPU tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch>=2.0,<3.0" \
            "safetensors>=0.4,<1.0" \
            "pytest>=8,<9"

      - name: Run CPU test suite
        env:
          PYTHONPATH: src
          LLAMA_CI_GPU: "0"
        run: |
          python -m pytest -v -m "not benchmark"

  package:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2"

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: llama-pure-compute:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max