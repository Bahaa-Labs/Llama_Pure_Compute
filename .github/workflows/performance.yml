name: Performance Regression

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    name: NVIDIA performance regression
    runs-on:
      - self-hosted
      - linux
      - x64
      - gpu

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: GPU information
        run: |
          nvidia-smi

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Verify CUDA backend
        run: |
          python - <<'PY'
          import torch
          from llama_pure_compute import is_cuda_backend_available

          assert torch.cuda.is_available(), \
              "CUDA unavailable"

          assert is_cuda_backend_available(), \
              "Custom CUDA backend unavailable"

          print("GPU:", torch.cuda.get_device_name(0))
          print(
              "Compute capability:",
              torch.cuda.get_device_capability(0),
          )
          PY

      - name: Run performance gate
        run: |
          python benchmarks/ci_performance.py \
            --baseline benchmarks/baselines/rtx3080.json \
            --output artifacts/performance.json

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.sha }}
          path: artifacts/performance.json
          if-no-files-found: error