name: CUDA Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cuda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-build-test:
    name: CUDA build and numerical correctness
    runs-on:
      - self-hosted
      - linux
      - x64
      - gpu

    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show hardware
        run: |
          nvidia-smi
          python --version
          python -m pip --version

      - name: Show CUDA and PyTorch
        run: |
          python - <<'PY'
          import torch

          print("PyTorch:", torch.__version__)
          print("PyTorch CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise SystemExit("CUDA is unavailable on the GPU runner.")

          print("GPU:", torch.cuda.get_device_name(0))
          print("Compute capability:", torch.cuda.get_device_capability(0))
          PY

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Verify CUDA backend
        run: |
          python - <<'PY'
          import llama_pure_compute

          print("Version:", llama_pure_compute.__version__)
          print(
              "CUDA backend:",
              llama_pure_compute.is_cuda_backend_available(),
          )

          if not llama_pure_compute.is_cuda_backend_available():
              raise SystemExit(
                  "Custom CUDA extension failed to load."
              )
          PY

      - name: Run numerical correctness tests
        env:
          LLAMA_CI_GPU: "1"
        run: |
          python -m pytest -v \
            -m "not benchmark" \
            tests/

      - name: Run CUDA benchmark smoke test
        run: |
          python benchmarks/benchmark_attention.py

      - name: Upload test and benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cuda-validation-${{ github.sha }}
          path: |
            .pytest_cache/
            benchmarks/
          if-no-files-found: ignore